name: Build launcher

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: ubuntu-latest
            rid: linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.419'
          dotnet-quality: ga
      - name: Read canonical application version
        id: version
        shell: pwsh
        run: |
          $version = (Get-Content -LiteralPath VERSION -Raw).Trim()
          if ([string]::IsNullOrWhiteSpace($version)) { throw 'VERSION is empty.' }
          "value=$version" >> $env:GITHUB_OUTPUT
      - name: Restore solution
        run: dotnet restore ManiaMapAnalyzerOverlay.sln
      - name: Verify C# formatting
        run: dotnet format ManiaMapAnalyzerOverlay.sln --no-restore --verify-no-changes --verbosity minimal
      - name: Build solution
        run: dotnet build ManiaMapAnalyzerOverlay.sln --configuration Release --no-restore --nologo
      - name: Run tests
        run: dotnet test ManiaMapAnalyzerOverlay.sln --configuration Release --no-build --nologo
      - name: Run production Pause Coach runtime tests
        run: node tests/Runtime/pause-coach-runtime.test.js
      - name: Run adapter Pause Coach integration tests
        run: node tests/Runtime/adapter-pause-coach-integration.test.js
      - name: Run native renderer precedence tests
        run: node tests/Runtime/renderer-native-precedence.test.js
      - name: Run headless analyzer protocol fixtures
        run: node assets/analyzer-engines/mania-map-analyser/fixtures/test-harness.mjs
      - name: Build application payload (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\scripts\build.ps1 -RuntimeIdentifier ${{ matrix.rid }} -OutputDirectory artifacts/payload
      - name: Build application payload (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: ./scripts/build.sh --runtime "${{ matrix.rid }}" --output artifacts/payload
      - name: Package application (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\scripts\package-installer.ps1 -Version ${{ steps.version.outputs.value }} -RuntimeIdentifier ${{ matrix.rid }}
      - name: Package application (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: ./scripts/package.sh --version "${{ steps.version.outputs.value }}" --runtime "${{ matrix.rid }}"
      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: Mania-Map-Analyzer-Overlay-${{ steps.version.outputs.value }}-${{ matrix.rid }}
          path: artifacts/Mania-Map-Analyzer-Overlay-${{ steps.version.outputs.value }}-${{ matrix.rid }}.*
