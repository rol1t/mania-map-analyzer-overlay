name: Build launcher

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build installer payload
        shell: powershell
        run: .\scripts\build.ps1
      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: Mania-Map-Analyzer-Overlay-Payload-2.0.0
          path: artifacts/payload
