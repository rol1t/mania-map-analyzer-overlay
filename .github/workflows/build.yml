name: Build launcher

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
            package: Mania-Map-Analyzer-Overlay-2.1.0-win-x64.zip
          - os: ubuntu-latest
            rid: linux-x64
            package: Mania-Map-Analyzer-Overlay-2.1.0-linux-x64.tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build application payload
        shell: powershell
        run: .\scripts\build.ps1 -RuntimeIdentifier ${{ matrix.rid }} -OutputDirectory artifacts/payload
      - name: Package application
        shell: powershell
        run: .\scripts\package-installer.ps1 -Version 2.1.0 -RuntimeIdentifier ${{ matrix.rid }}
      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: Mania-Map-Analyzer-Overlay-2.1.0-${{ matrix.rid }}
          path: artifacts/${{ matrix.package }}
