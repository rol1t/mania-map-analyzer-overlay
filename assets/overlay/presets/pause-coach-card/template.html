<div id="overlay-difficulty-timeline" class="overlay-difficulty-timeline" data-overlay-preset-node hidden>
  <div class="overlay-difficulty-timeline-header">
    <span class="overlay-difficulty-timeline-title">Difficulty over time</span>
    <span id="overlay-difficulty-timeline-current" class="overlay-difficulty-timeline-current">—</span>
  </div>
  <div class="overlay-difficulty-timeline-plot">
    <svg viewBox="0 0 1000 180" preserveAspectRatio="none" role="img" aria-label="Difficulty over time">
      <path id="overlay-difficulty-timeline-area" class="overlay-difficulty-timeline-area" d=""></path>
      <path id="overlay-difficulty-timeline-line" class="overlay-difficulty-timeline-line" d=""></path>
      <line id="overlay-difficulty-timeline-cursor" class="overlay-difficulty-timeline-cursor" x1="0" y1="0" x2="0" y2="180" hidden></line>
    </svg>
  </div>
  <div class="overlay-difficulty-timeline-footer">
    <span id="overlay-difficulty-timeline-start">0:00</span>
    <span>difficulty</span>
    <span id="overlay-difficulty-timeline-end">—</span>
  </div>
</div>

<div id="overlay-pause-coach" class="pause-coach-card-root overlay-pause-coach" hidden data-overlay-preset-node>
  <div class="pause-coach-header">
    <div><strong id="overlay-pause-coach-title">Pause Coach</strong><span id="overlay-pause-coach-subtitle">Realtime attempt diagnosis</span></div>
    <span id="overlay-pause-status" class="pause-coach-badge">Waiting</span>
  </div>
  <div id="overlay-pause-coach-primary" class="pause-coach-primary" hidden></div>
  <div class="pause-coach-stats">
    <div><small>Bias</small><strong id="overlay-pause-bias">—</strong></div>
    <div><small>UR</small><strong id="overlay-pause-ur">—</strong></div>
    <div><small>Recent</small><strong id="overlay-pause-recent">—</strong></div>
    <div><small>Accuracy</small><strong id="overlay-pause-accuracy">—</strong></div>
    <div><small>Score</small><strong id="overlay-pause-score">—</strong></div>
    <div><small>Combo</small><strong id="overlay-pause-combo">—</strong></div>
    <div><small>Section</small><strong id="overlay-pause-section">—</strong></div>
  </div>
  <div id="overlay-pause-coach-secondary" class="pause-coach-secondary" hidden></div>
  <div id="overlay-pause-insights" class="pause-coach-insights" hidden></div>
  <div id="overlay-pause-coach-diagnostics" class="pause-coach-diagnostics" hidden></div>
</div>
